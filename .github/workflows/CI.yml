name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache delete the old caches it created
      contents: read
      id-token: write # Codecov upload with OIDC
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # LTS
          - '1'    # latest release
        package:
          - LearningToOptimize
          - L2OCore
          - L2OSobolev
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Julia 1.10 ignores the [sources] section of Project.toml, so the lib/
      # subpackages are developed explicitly (harmless on newer versions).
      - name: Develop lib/ subpackages
        if: matrix.package == 'LearningToOptimize'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path = "lib/L2OCore"))
          Pkg.instantiate()
      - name: Develop L2OCore into lib/L2OSobolev
        if: matrix.package == 'L2OSobolev'
        shell: julia --color=yes --project=lib/L2OSobolev {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path = "lib/L2OCore"))
          Pkg.instantiate()
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package == 'LearningToOptimize' && '.' || format('lib/{0}', matrix.package) }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,lib/L2OCore/src,lib/L2OSobolev/src,lib/L2OSobolev/ext
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
